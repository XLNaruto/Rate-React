<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/media/logos/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Rate + React AI</title>
    <meta name="description" content="Scan, rate + react — share your experience in seconds." />

    <!-- Open Graph (Facebook, WhatsApp, iMessage, Telegram, LinkedIn, Slack) -->

         every link. Per-slug previews (vendor logo / product image) are injected
         at the edge for crawler user-agents by a Lambda@Edge function on the
         CloudFront distribution (see infra/og-lambda-edge). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rate + React" />
    <meta property="og:title" content="Rate + React AI" />
    <meta property="og:description" content="Scan, rate + react — share your experience in seconds." />
    <meta property="og:image" content="https://review.rateandreact.com/media/social/share-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://review.rateandreact.com/" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rate + React AI" />
    <meta name="twitter:description" content="Scan, rate + react — share your experience in seconds." />
    <meta name="twitter:image" content="https://review.rateandreact.com/media/social/share-default.png" />
  </head>
